[package]
name = "intear-launch"
description = "cargo-near-new-project-description"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/INTEARnear/launch"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.0"
image_digest = "sha256:51ab40efd798eae26c0dc71180909303f10bb4988b15ce3a18522c5be06e277e"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = { version = "5.29", features = ["global-contracts"] }
near-contract-standards = "5.29"
intear-dex-types = { git = "https://github.com/INTEARnear/dex", features = ["json"] }
xyk-dex-types = { git = "https://github.com/INTEARnear/dex" }

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing", "global-contracts"] }
near-workspaces = { version = "0.23", features = ["unstable"] }
near-primitives = "0.37"
near-crypto = "0.37"
near-jsonrpc-client = "0.22"
near-jsonrpc-primitives = "0.37"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true
